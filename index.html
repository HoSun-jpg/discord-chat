
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Clone</title>
    <!-- wwwroot/css/style.css 불러오기 -->
    <link rel="stylesheet" href="css/style.css" asp-append-version="true" />
    <!-- SignalR JS 라이브러리 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
</head>
<body>

    <!-- 1. 최좌측: 서버 아이콘 사이드바 -->
    <div class="server-sidebar">
        <div class="server-icon home">D</div>
        <div class="server-divider"></div>
        <div class="server-icon">코딩</div>
        <div class="server-icon">게임</div>
        <div class="server-icon add-btn">+</div>
    </div>

    <!-- 2. 좌측: 채널 사이드바 -->
    <div class="channel-sidebar">
        <div class="server-header">
            <span>개발자 아지트</span>
            <span style="font-size: 0.75rem;">▼</span>
        </div>

        <div class="channel-list">
            <div>
                <div class="channel-group-title">텍스트 채널</div>
                <div class="channel-item active">
                    <span class="prefix">#</span> 일반
                </div>
                <div class="channel-item">
                    <span class="prefix">#</span> 질문-답변
                </div>
            </div>

            <div>
                <div class="channel-group-title">음성 채널</div>
                <div class="channel-item">
                    <span style="margin-right: 8px;">🔊</span> 일반 음성
                </div>
            </div>
        </div>

        <!-- 하단 내 프로필 -->
        <div class="user-profile-bar">
            <div class="profile-info">
                <div class="avatar" id="avatarText">나</div>
                <div class="profile-text">
                    <span id="displayUsername" class="username">사용자</span>
                    <span class="user-status">온라인</span>
                </div>
            </div>
            <div class="profile-controls">
                <button>🎙️</button>
                <button>🎧</button>
            </div>
        </div>
    </div>

    <!-- 3. 중앙: 채팅 화면 영역 -->
    <div class="chat-area">
        <div class="chat-header">
            <span class="header-hash">#</span>
            <span class="header-title">일반</span>
            <span class="header-desc">자유롭게 대화를 나누는 공간입니다.</span>
        </div>

        <!-- 메시지 출력 영역 -->
        <div id="messagesList" class="messages-list">
            <div class="welcome-banner">
                <div class="welcome-icon">#</div>
                <h1 class="welcome-title">#일반 채널에 오신 것을 환영합니다!</h1>
                <p class="welcome-desc">#일반 채널의 시작입니다.</p>
            </div>
        </div>

        <!-- 메시지 입력 영역 -->
        <div class="input-area">
            <div class="input-box">
                <button class="add-file-btn">+</button>
                <input type="text" id="messageInput" placeholder="#일반에 메시지 보내기" class="chat-input" />
                <button id="sendButton" class="send-btn">전송</button>
            </div>
        </div>
    </div>

    <!-- SignalR 클라이언트 스크립트 -->
    <!-- Socket.io 라이브러리 불러오기 (SignalR 대신 사용) -->
<script src="/socket.io/socket.io.js"></script>
<script>
    // 1. 닉네임 설정
    const username = prompt("사용할 닉네임을 입력하세요:", "유저_" + Math.floor(Math.random() * 1000)) || "익명유저";
    document.getElementById("displayUsername").innerText = username;
    
    const avatarEl = document.getElementById("avatarText");
    if(avatarEl) avatarEl.innerText = username.substring(0, 1);

    // 2. 소켓 서버 연결
    const socket = io();

    // 3. 서버에서 메시지를 받았을 때 화면에 추가
    socket.on("receiveMessage", function (data) {
        const messagesList = document.getElementById("messagesList");
        
        const messageElement = document.createElement("div");
        messageElement.className = "message-item";
        
        messageElement.innerHTML = `
            <div class="msg-avatar">
                ${escapeHtml(data.user.substring(0, 1))}
            </div>
            <div class="msg-content">
                <div class="msg-header">
                    <span class="msg-author">${escapeHtml(data.user)}</span>
                    <span class="msg-time">${data.time}</span>
                </div>
                <div class="msg-text">${escapeHtml(data.message)}</div>
            </div>
        `;
        
        messagesList.appendChild(messageElement);
        messagesList.scrollTop = messagesList.scrollHeight;
    });

    function sendMessage() {
        const messageInput = document.getElementById("messageInput");
        const message = messageInput.value.trim();
        
        if (message !== "") {
            socket.emit("sendMessage", {
                user: username,
                message: message
            });
            messageInput.value = "";
        }
    }

    document.getElementById("sendButton").addEventListener("click", sendMessage);
    document.getElementById("messageInput").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }
</script>
</body>
</html>
