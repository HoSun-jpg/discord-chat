<!-- Socket.io 라이브러리 불러오기 -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // 1. 닉네임 설정
        const username = prompt("사용할 닉네임을 입력하세요:", "유저_" + Math.floor(Math.random() * 1000)) || "익명유저";
        document.getElementById("displayUsername").innerText = username;
        
        const avatarEl = document.getElementById("avatarText");
        if(avatarEl) avatarEl.innerText = username.substring(0, 1);

        // 2. 소켓 서버 연결
        const socket = io();

        // 3. 메시지 1개를 화면에 그려주는 함수 (공통 사용)
        function renderSingleMessage(data) {
            const messagesList = document.getElementById("messagesList");
            const messageElement = document.createElement("div");
            messageElement.className = "message-item";
            
            messageElement.innerHTML = `
                <div class="msg-avatar">
                    ${escapeHtml(data.user ? data.user.substring(0, 1) : "")}
                </div>
                <div class="msg-content">
                    <div class="msg-header">
                        <span class="msg-author">${escapeHtml(data.user || "")}</span>
                        <span class="msg-time">${data.time || ""}</span>
                    </div>
                    <div class="msg-text">${escapeHtml(data.message || "")}</div>
                </div>
            `;
            
            messagesList.appendChild(messageElement);
            messagesList.scrollTop = messagesList.scrollHeight;
        }

        // 4. 접속 시 서버에 저장된 이전 메시지 전체 불러오기
        socket.on("loadHistory", function (history) {
            if (Array.isArray(history)) {
                history.forEach(function (data) {
                    renderSingleMessage(data);
                });
            }
        });

        // 5. 누군가 새 메시지를 보냈을 때 실시간으로 받기
        socket.on("receiveMessage", function (data) {
            renderSingleMessage(data);
        });

        // 6. 메시지 전송 함수
        function sendMessage() {
            const messageInput = document.getElementById("messageInput");
            const message = messageInput.value.trim();
            
            if (message !== "") {
                socket.emit("sendMessage", {
                    user: username,
                    message: message
                });
                messageInput.value = "";
            }
        }

        // 7. 버튼 클릭 및 엔터키 이벤트 등록
        document.getElementById("sendButton").addEventListener("click", sendMessage);
        document.getElementById("messageInput").addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });

        // 8. HTML 태그 이스케이프 (보안 처리)
        function escapeHtml(text) {
            if (!text) return "";
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
